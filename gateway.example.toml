# Aria Push Gateway — example configuration
# Copy to gateway.toml and edit for your environment.

[server]
listen = "0.0.0.0:8080"
public_url = "https://gateway.example.com"

[database]
# SQLite database path (created automatically)
url = "sqlite:gateway.db?mode=rwc"

[auth]
# JWT signing secret: at least 32 characters, e.g. `openssl rand -hex 32`.
# The gateway refuses to start with an empty, placeholder (CHANGE-ME...) or
# shorter secret unless run with --insecure-dev-secret (local dev only).
secret = "CHANGE-ME-TO-A-STRONG-RANDOM-SECRET"
# Token expiry in seconds (default: 30 days)
token_expiry_secs = 2592000
# Shared key the Aria PBX API presents to POST /v1/auth/token to mint tokens
# (it sends it as "api_key"). Use a long random value, e.g.
# `openssl rand -hex 32`, and keep it different from `secret`. The
# TOKEN_ISSUER_KEY environment variable overrides this. If neither is set,
# the token endpoint refuses every request (503).
# token_issuer_key = "CHANGE-ME-TO-A-DIFFERENT-STRONG-RANDOM-KEY"

[sip]
# SIP is accepted only from the IPs each registrar (or dialled server)
# resolves to, on any port. If the PBX sends from other addresses — a
# floating/reserved IP whose packets leave from the droplet's own IP, a host
# with several addresses, or several proxy nodes — list them here as
# comma-separated IPs/CIDRs. The TRUSTED_SIP_SOURCES environment variable
# overrides this.
# trusted_sources = "10.10.0.0/16, 203.0.113.7"

# ── Push Notification Providers ──────────────────────────────────────────────

# Apple Push Notification Service (iOS)
# Uncomment and configure for iOS push notifications.
# [push.apns]
# key_path = "/path/to/AuthKey_XXXXXXXXXX.p8"
# key_id = "XXXXXXXXXX"
# team_id = "XXXXXXXXXX"
# bundle_id = "com.example.aria"
# sandbox = false   # set true for development builds

# Firebase Cloud Messaging (Android)
# Uncomment and configure for Android push notifications.
# [push.fcm]
# service_account_path = "/path/to/firebase-service-account.json"
# project_id = "your-firebase-project-id"

[push]
# At least one provider (apns or fcm) should be configured.
# The gateway will start without push configuration but won't
# be able to deliver incoming call notifications.
