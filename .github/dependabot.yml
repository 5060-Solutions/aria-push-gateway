# Weekly dependency PRs. Minor and patch updates are grouped so one PR per
# ecosystem lands on Monday; majors come separately and are opt-in by review.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/New_York }
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/New_York }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/New_York }
    groups:
      docker:
        patterns: ["*"]
