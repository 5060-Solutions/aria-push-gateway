name: Build & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-push-gateway
  cancel-in-progress: true

jobs:
  publish:
    name: Build & publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/5060-solutions/aria-push-gateway:latest
            ghcr.io/5060-solutions/aria-push-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
